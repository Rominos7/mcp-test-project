version: '3.8'

services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: mcp-server-http
    image: mcp-server:latest
    ports:
      - "3000:3000"
    environment:
      # Server Configuration
      NODE_ENV: ${NODE_ENV:-production}
      MCP_PORT: ${MCP_PORT:-3000}

      # Security
      MCP_API_KEY: ${MCP_API_KEY:-development-key}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:*}

      # AI Configuration
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}

    # Optional: Mount .env file (alternative to environment variables above)
    # env_file:
    #   - .env

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Optional: Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Networks (optional, for multiple services)
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge
